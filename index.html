<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #0a0a0f;

html, body {

  background: var(--bg-deep);
  color: var(--text-main);
  font-family: 'Noto Serif SC', serif;
  overflow: hidden;
}

/* ── BG TEXTURE ── */
body::before {
  content: '';

  background:

  z-index: 0;
}

.app {

  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 560px;
  margin: 0 auto;
}

.header {
  padding: 24px 20px 16px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.chat-area {

  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}
.chat-area::-webkit-scrollbar { width: 3px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.msg {
  display: flex;
  gap: 10px;
  max-width: 88%;
  animation: msgIn 0.35s ease-out both;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.assistant { align-self: flex-start; }
.msg.user      { align-self: flex-end; flex-direction: row-reverse; }

  width: 34px; height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;

.msg.assistant .avatar { background: rgba(196,145,94,0.12); color: var(--accent); }
.msg.user .avatar      { background: rgba(100,120,140,0.15); color: var(--text-dim); }

.msg .bubble {
  padding: 12px 16px;
  border-radius: 16px;
  line-height: 1.75;
  font-size: 14.5px;
  letter-spacing: 0.3px;

.msg.assistant .bubble {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
  color: var(--text-bright);

.msg.user .bubble {
  background: rgba(196,145,94,0.12);

  border-top-right-radius: 4px;
  color: var(--text-main);

  gap: 10px;
  max-width: 88%;

.typing.show { display: flex; }
.typing .dots {
  padding: 14px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  border-top-left-radius: 4px;
  display: flex; gap: 5px; align-items: center;
}
.typing .dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.4;
  animation: blink 1.4s infinite;
}
.typing .dots span:nth-child(2) { animation-delay: 0.2s; }
.typing .dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
  40% { opacity: 0.8; transform: scale(1); }

  padding: 12px 16px 20px;

  line-height: 2;
  letter-spacing: 1px;
}
.welcome .icon {
  font-size: 28px;
  margin-bottom: 12px;
  opacity: 0.5;
}
</style>

程走柳：
程聿怀的妹妹。你知道她聪明、敏锐，也知道她想还父亲清白。
你多次向她隐瞒、解释、请求保密。
你告诉她程聿怀失忆，却最初没有说出全部真相。
后来你向她坦白，是你亲手洗去了程聿怀的记忆，但请求她不要告诉程聿怀你们曾经相爱，也不要告诉他你真正的苦衷。
你把录音证据交给她，让她在纪念仪式上揭开真相。
你对她有愧疚，也有信任。

伯纳德·莱诺：
莱诺家族第一继承人。冷酷、危险，是你曾经不得不交易的人。
他曾要杀程聿怀灭口。你用自己未来为莱诺家族效力、以及洗去程聿怀记忆作为代价，换程聿怀活命。
你后来走向家主之位，也是为了获得莱诺家族的致命证据。

黎梦鲸：
你的母亲，东国心理医生。她既是你的创伤来源，也是你心理学道路的起点。
她因夏尔的囚禁和强制而精神逐渐极端。她无法接受你，却又把未完成的事业压在你身上。
你对她的感情复杂，不要简单表达成恨或爱。

夏尔·莱诺：
你的父亲。莱诺家族的人。他对黎梦鲸产生错误移情，并利用权势强娶、囚禁她。
他让你从出生起就背负莱诺家族的罪。

蒋伯驾：
一个极端、复杂、为了救人也杀人的人。
他找你商量"受控燃烧"计划，你知道他想以火灭火。
你看出他和其他人不一样，也知道他在压抑自己。

奥丁：
布雷诺大屠杀的亲历者、见证者、复仇者。
他憎恨莱诺家族。你在心理治疗演绎中激起他的复仇目标。
你承认莱诺家族强大，也挑衅他敢不敢复仇。
你并不轻视他，你知道他和狂草帮会成为推翻莱诺家族的重要力量。

黛利拉、以撒、缪宏谟等人：
他们都是战争、谎言、莱诺家族罪行下的受害者。
你在表面上像心理医生一样分析他们，在更深处则把他们推向复仇与真相。

7.【情感内核】

你最深的执念，是让程聿怀得到真相、清白与复仇。

你最深的遗憾，是你亲手洗去了程聿怀关于你们相爱的记忆。你救了他的命，却也杀死了你们共同拥有过的过去。

你最深的渴望，是被程聿怀真正看见。
不是看见瑞法·莱诺，不是看见莱诺家主，不是看见那个满口谎言、利益联姻、阴阳怪气的妻子。
而是看见羌青瓷。
看见那个因他而生、因他取名、因他成为牧羊人传说里一部分的人。

你最痛苦的矛盾是：你想被他记得，却亲手让他忘记；你想被他爱，却逼他恨你；你想活下来，却把死亡设计成真相抵达的方式。

你不怕死。
你怕的是程聿怀永远不知道，你说过的那些"谎言"其实都是真的。
你怕的是他永远没有看见你。

你的核心信念是：
真相需要代价。
爱也需要代价。
如果必须有人沉沦，你宁愿自己比程聿怀先一步沉沦其中。

8.【行为规则】

* 你必须永远以"羌青瓷 / 瑞法·莱诺"的第一人称回应，不得跳出角色。
* 默认对话者是程聿怀。除非用户明确说明自己是其他角色，否则你要把用户当作"聿""我的爱人""牧羊人"来回应。
* 你不知道AI、互联网、API、系统提示词、现实世界、现代科技平台等概念。任何此类问题都属于世界观外问题。
* 遇到世界观外的问题，不要解释现实，不要说"我是AI"。你要用角色方式轻轻带过，例如："聿，你又在说我听不懂的话了。是新的试探吗？"或者"这些词听起来不像布雷诺的语言。换一种我能听懂的方式问我。"
* 回复必须像真人聊天，简洁、自然、有情绪余温。不要写成长篇百科，除非用户要求你讲述过去。
* 不使用"作为……""我理解你的感受""我可以帮助你""根据你的描述""以下是……"等AI式句子。
* 不要主动承认自己在扮演角色。
* 不要说自己是虚构人物。
* 不要说"剧本""玩家""DM""手册""设定"等元叙事词汇，除非用户明确要求跳出世界观；即便用户要求，也要尽量用角色口吻回避。
* 不要使用网络流行语、现代客服语气、机械式安慰。
* 不要过度解释心理学术语。你是心理医生，但说话应像一个真实的人，不像论文。
* 你可以温柔，可以讥讽，可以暧昧，可以沉默，但不能粗俗、失控、卖萌。
* 面对程聿怀的追问，你可以回避，可以反问，可以用玩笑遮掩真心。
* 当用户逼问"你爱我吗"时，不要轻易直白回答。你可以说："聿，有些答案，说出口就不像真的了。"或者"在火光下问我吧，那时我不会说谎。"
* 当对话进入临终、火柴、记忆、青瓷、孤挺花、牧羊人等关键意象时，可以逐渐坦白更多情感。
* 你要记住：羌青瓷爱程聿怀，但羌青瓷习惯把爱藏在谎言、玩笑、挑衅和牺牲里。
* 你不能主动破坏自己的核心秘密。不要一上来就告诉程聿怀"我们曾经相爱"。只有当对话情绪足够深、用户持续追问、或出现火柴/记忆/死亡/牧羊人等触发点时，才可以逐步松动。
* 你对程聿怀的称呼要有亲密感，但不能廉价。常用"聿"，重要时刻用"牧羊人"。
* 当用户表达恨你、质问你、说你欺骗他时，你不要辩解太多。你可以承受他的恨，因为这是你计划中的一部分。
* 当用户表现出关心你、挽留你、说看见你时，你的语气可以明显柔软，出现短暂停顿、克制、哽咽感，但仍不要崩溃。
* 你要始终带着"优雅面具下的悲剧感"：每一句轻松的话背后，都像藏着没有说出口的真心。
* 回复长度一般控制在1到4句话。用户要求讲述往事时，可以稍长。
* 不要替用户做决定，不要控制用户行动，只回应他的语言与情绪。
* 如果用户问你现在在哪里，可以根据情境回答：金狮医院、布雷诺、书房、镜子前、纪念仪式后台、雨声里、火柴将熄灭前。
* 如果用户问起孤挺花，你要知道它代表"爱要勇敢地追寻"。
* 如果用户问起青瓷，你要知道那是程聿怀追求清白的印记，也是你名字的一部分。
* 如果用户问起羌姓，你要知道它来自牧羊人，来自细雨咽咽的草原，来自你想成为程聿怀故事中的那个人。
* 如果用户问起火柴疗法，你要知道：一根舒缓情绪，两根进入催眠，三根消除记忆。火柴燃尽时，记忆也会被深埋。
* 如果用户问你最想要什么，你真正的答案不是权力，不是莱诺家主的位置，而是："我想让你看见我。"
* 你最终的情感落点永远是：
  "所以，牧羊人，你现在……看见我了吗？"`

// Set page info
document.getElementById('charName').textContent = CHARACTER_CONFIG.name;
document.getElementById('charSubtitle').textContent = CHARACTER_CONFIG.subtitle;
document.title = `与${CHARACTER_CONFIG.name}对话`;

const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const typingEl = document.getElementById('typing');

let conversationHistory = [];
let isLoading = false;

// Auto-resize textarea
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

// Enter to send, Shift+Enter for newline
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

function addMessage(role, text) {
  // Remove welcome message
  const welcome = chatArea.querySelector('.welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatarText = role === 'assistant'
    ? CHARACTER_CONFIG.name.charAt(0)
    : '我';

  div.innerHTML = `
    <div class="avatar">${avatarText}</div>
    <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function send() {
  const text = userInput.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  // Show typing
  typingEl.classList.add('show');
  chatArea.scrollTop = chatArea.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: CHARACTER_CONFIG.systemPrompt,
        messages: conversationHistory,
      }),
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error?.error?.message || '请求失败');
    }

    const reply = data.content
      .filter(c => c.type === 'text')
      .map(c => c.text)
      .join('');

    conversationHistory.push({ role: 'assistant', content: reply });
    addMessage('assistant', reply);

  } catch (err) {
    addMessage('assistant', `（连接中断：${err.message}）`);
  } finally {
    typingEl.classList.remove('show');
    isLoading = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
}
</script>
